# Redis config for the BRAND supervisor, portable across macOS and Linux.
#
# BRAND's stock redis.supervisor.conf binds a Unix socket and pidfile under
# /var/run, which requires root (fatal on macOS, needs sudo on Linux). This
# config keeps the settings that matter for BRAND and drops the privileged
# paths; the supervisor passes it via its -c flag. Host/port are appended by
# the supervisor's --bind/--port arguments.

protected-mode no
enable-protected-configs yes
timeout 0
daemonize no
supervised no
loglevel notice
logfile ""

# BRAND gotcha (see brand README): periodic background saves add latency
# spikes, so disable them during runs; data is persisted explicitly with the
# saveRdb command if needed.
save ""
appendonly no
stop-writes-on-bgsave-error yes
dbfilename dump.rdb
dir ./
